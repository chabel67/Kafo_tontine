databases:
  - name: kafo-db
    plan: free
    databaseName: kafo
    user: kafo

services:
  - type: web
    name: kafo-api
    runtime: php
    plan: free
    healthCheckPath: /up

    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction
      php artisan config:cache
      php artisan route:cache
      php artisan migrate --force

    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT

    envVars:
      - key: APP_NAME
        value: Kafo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_TIMEZONE
        value: Africa/Cotonou

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: kafo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kafo-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: kafo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: kafo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kafo-db
          property: password

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: SESSION_DOMAIN
        sync: false

      - key: SMS_DRIVER
        value: log
      - key: MAIL_MAILER
        value: log
